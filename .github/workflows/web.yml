name: Web

# Checks that the web version still builds. It is published from
# https://github.com/jdswe/medset to https://jdswe.github.io/medset/.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build web version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compile web version with TeaVM
        run: bash ./mvnw --batch-mode --no-transfer-progress -f web/pom.xml package

      - name: Check site files
        run: |
          for f in index.html css/app.css js/app.js js/venn.js js/medset.js img/medset-logo.png; do
            test -s "web/target/sitio/$f" || { echo "Missing $f"; exit 1; }
          done
