name: Maven

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run Maven tests
        run: bash ./mvnw --batch-mode --no-transfer-progress test package dependency:copy-dependencies "-DincludeScope=runtime" "-DoutputDirectory=target/package-input"
      - name: Prepare application image
        run: |
          cp target/medset-*.jar target/package-input/medset.jar
          jpackage --type app-image --name MedSet \
            --module-path target/package-input \
            --module com.medset/com.medset.Launcher \
            --java-options "--enable-native-access=javafx.graphics" \
            --icon src/main/packaging/medset.png \
            --dest target/app-image
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - name: Smoke test packaged application and FXML views
        run: xvfb-run --auto-servernum target/app-image/MedSet/bin/MedSet --smoke-test
