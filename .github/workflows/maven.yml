name: Maven

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run Maven tests
        run: bash ./mvnw --batch-mode --no-transfer-progress test package dependency:copy-dependencies "-DincludeScope=runtime" "-DoutputDirectory=target/package-input"
      - name: Prepare application image
        run: |
          cp target/medset-ai-1.0.2.jar target/package-input/medset-ai.jar
          jpackage --type app-image --name MedSetAI \
            --input target/package-input \
            --main-jar medset-ai.jar \
            --main-class com.medset.medsetai.Launcher \
            --dest target/app-image
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - name: Smoke test packaged application and FXML views
        run: xvfb-run --auto-servernum target/app-image/MedSetAI/bin/MedSetAI --smoke-test
