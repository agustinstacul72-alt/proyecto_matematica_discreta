name: Web (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # The web version compiles the same logica/ and modelo/ classes, so the
      # desktop tests run first: if they fail, the site is not published.
      - name: Run shared logic tests
        run: bash ./mvnw --batch-mode --no-transfer-progress test

      - name: Compile web version with TeaVM
        run: bash ./mvnw --batch-mode --no-transfer-progress -f web/pom.xml package

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/target/sitio

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
